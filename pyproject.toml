# Settings for the tools that test and lint hooks/ (the docs build itself uses requirements.txt).

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hooks", "checks", "tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=llms_txt",
    "--cov=llmstxt_directive",
    "--cov=agent_scores",
    "--cov-report=term-missing",
    "--cov-fail-under=95",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["hooks", "checks", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import order
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C4",           # comprehensions
    "PTH",          # pathlib
    "RUF",
    "S",            # bandit security checks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is how pytest checks
"hooks/llms_txt.py" = ["S310"]  # urlopen of https://docs.percona.com URLs only
"checks/agent_scores.py" = ["S310"]  # same

[tool.mypy]
python_version = "3.10"
files = ["hooks", "checks", "tests"]
mypy_path = ["hooks", "checks", "tests"]
strict = true
warn_unreachable = true
