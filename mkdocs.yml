  - tags:
      tags_file: new/tags.md
#  search: 
#    separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - meta-descriptions:
      export_csv: false
      quiet: false
      enable_checks: false
      min_length: 50
      max_length: 160
  - git-committers:
      enabled: !ENV [CI, false]
      repository: percona/docs-home
      branch: "main"
  # Markdown version of every page (page/index.md) for AI agents.
  # Its own llms.txt is replaced by hooks/llms_txt.py, which runs after it.
  - llmstxt:
      # hooks/llmstxt_directive.py runs the clean-up itself, after it converts the product cards.
      autoclean: false
      preprocess: hooks/llmstxt_directive.py
      sections:
        Pages:
          - "*.md"

