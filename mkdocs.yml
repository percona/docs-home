site_name: Percona Documentation
site_url: https://docs.percona.com/

# Theme setup
theme:
  name: material
  features:
    - navigation.indexes
  custom_dir: overrides
  logo: assets/percona-mark.svg
  favicon: assets/percona-favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Color theme set to Automatic. Click to change
    - media: "(prefers-color-scheme: light)"
      scheme: percona-light
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Color theme set to Light Mode. Click to change
    - media: "(prefers-color-scheme: dark)"
      scheme: percona-dark
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Color theme set to Dark Mode. Click to change

  features:
    - navigation.indexes
#    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - css/design.css
  - css/landing.css
  - css/osano.css
  - css/extra.css
  - css/rating.css
  - css/algolia.css
  - css/kapa.css
  - https://cdn.jsdelivr.net/npm/@docsearch/css@3

extra_javascript:
  - js/hide-back-to-index.js
  - https://cdn.jsdelivr.net/npm/@docsearch/js@latest
  - js/init-algolia.js
  - js/rating.js
  - js/kapa.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
       custom_icons:
          - overrides/.icons
  - pymdownx.snippets:
      base_path: ["snippets"]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Writes llms.txt, the documentation index for AI agents, plus llms-full.txt and skill.md (from agents/)
hooks:
  - hooks/llms_txt.py

# Plugins configuration
plugins:
  - blog:
      blog_dir: new
      categories_name: Updates per category
      pagination_per_page: 10
#    archive_date_format: yyyy MMMM
#    archive_url_date_format: yyyy/MM
  - rss:
      match_path: new/posts/.*
      date_from_meta:
        as_creation: date
      feed_title: "Percona Documentation What's New Feed"
      image: https://docs.percona.com/assets/Percona-Logo.png
      length: 40
      url_parameters:
        utm_source: rss
        utm_medium: feed
        utm_campaign: all-products
  # One feed per product category: /feed_rss_<category-slug>.xml
  # Each feed only includes posts from its folder under docs/new/posts/.
  # utm_campaign shows which feed a visit came from in Google Analytics.
  - rss:
      match_path: "new/posts/MongoDB/.*"
      date_from_meta:
        as_creation: date
      feed_title: "Percona Documentation What's New: MongoDB"
      feed_description: "Release announcements and updates for MongoDB"
      image: https://docs.percona.com/assets/Percona-Logo.png
      length: 40
      json_feed_enabled: false
      feeds_filenames:
        rss_created: feed_rss_mongodb.xml
        rss_updated: feed_rss_mongodb_updated.xml
        json_created: feed_json_mongodb.json
        json_updated: feed_json_mongodb_updated.json
      url_parameters:
        utm_source: rss
        utm_medium: feed
        utm_campaign: mongodb
