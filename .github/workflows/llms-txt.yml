name: llms.txt

on:
  pull_request:
    paths:
      - "docs/*.md"
      - "hooks/llms_txt.py"
      - "mkdocs.yml"
      - ".github/workflows/llms-txt.yml"
  schedule:
    - cron: "0 6 * * 1"  # Mondays: catch links broken by product site changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build llms.txt and check its links and size
        run: python hooks/llms_txt.py --check --out llms.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llms.txt
          path: llms.txt
