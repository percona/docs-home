name: llms.txt

on:
  pull_request:
    paths:
      - "docs/*.md"
      - "hooks/**"
      - "tests/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/llms-txt.yml"
  push:
    branches: [main]
    paths:
      - "docs/*.md"
      - "hooks/**"
      - "tests/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "requirements-dev.txt"
      - ".github/workflows/llms-txt.yml"
  schedule:
    - cron: "17 6 * * 1"  # Mondays: catch links broken by changes on the product sites
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install tools (versions and hashes pinned)
        run: python -m pip install --require-hashes --no-deps -r requirements-dev.txt
      - name: Lint
        run: ruff check hooks tests
      - name: Format
        run: ruff format --check hooks tests
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest

  oldest-python:
    name: Build offline on the oldest supported Python
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Build llms.txt without network lookups
        run: python hooks/llms_txt.py --offline --out llms.txt

  links:
    name: Build llms.txt and check its links
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build llms.txt, fail on broken links, layout problems or size
        run: python hooks/llms_txt.py --check --out llms.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: llms.txt
          path: llms.txt
          if-no-files-found: ignore
          retention-days: 14
